<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="40" fill="#0f0f0f"/>
  <!--
    Crescent path: intersection of outer circle (cx=96,cy=96,r=58)
    and shadow circle (cx=74,cy=96,r=52) is at (70, 44) and (70, 148).
